services:
  nginx:
    image: nginx:alpine
    container_name: pr1_nginx
    ports: ["8082:80"]
    volumes:
      - ./web:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [php]
    networks: [pr1-net]

  php:
    build: .
    container_name: pr1_php
    volumes: ['./web:/var/www/html']
    networks: [pr1-net]

  mysql:
    image: mysql:8.0
    container_name: pr1_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: login_app
    volumes: ['./mysql_data:/var/lib/mysql']
    networks: [pr1-net]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pr1_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpass
    ports: ["8081:80"]
    depends_on: [mysql]
    networks: [pr1-net]

networks:
  pr1-net:
