<!DOCTYPE html>
<html>
<body>

<div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999;">
  <div style="background:white; margin:auto; padding:20px; width:400px; margin-top:100px; border-radius:5px;">
    <span onclick="document.getElementById('authModal').style.display='none'" style="cursor:pointer; float:right; font-size:28px;">&times;</span>
    
    <h2>Login</h2>
    <form action="acceso.php" method="POST">
      <input type="email" name="email" placeholder="Email" required style="width:100%; padding:10px; margin:10px 0;">
      <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0;">
      <button name="submit" style="width:100%; padding:10px; background:#32b8c6; color:white; border:none; cursor:pointer;">Sign In</button>
    </form>
    
    <hr>
    
    <h2>Register</h2>
    <form action="registro.php" method="POST">
      <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin:10px 0;">
      <input type="email" name="email" placeholder="Email" required style="width:100%; padding:10px; margin:10px 0;">
      <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0;">
      <input type="password" name="cpassword" placeholder="Confirm Password" required style="width:100%; padding:10px; margin:10px 0;">
      <button name="submit" style="width:100%; padding:10px; background:#32b8c6; color:white; border:none; cursor:pointer;">Sign Up</button>
    </form>
  </div>
</div>

<script>
function openAuth() {
  document.getElementById('authModal').style.display = 'block';
}
</script>

</body>
</html>
