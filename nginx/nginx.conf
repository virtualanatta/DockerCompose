server {
    listen 80;
    root /var/www/html;
    index index.html index.php;

    # Static assets
    location /assets/ { 
        expires 1y; 
    }
    location /images/ { 
        expires 1M; 
    }
    
    # PHP handler - PRIMERO
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Redirect rules
    location = /login { 
        return 302 /acceso.php; 
    }
    location = /registro { 
        return 302 /registro.php; 
    }

    # Try files (sin index.html forzado)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
