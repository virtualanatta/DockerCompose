server {
    listen 80;
    root /var/www/html;
    index index.html;

    server_tokens off;

    location /assets/ { expires 1y; }
    location /images/ { expires 1M; }

    location ~ /\. { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location = /login    { return 302 /acceso.php; }
    location = /registro { return 302 /registro.php; }

    location / {
        try_files $uri $uri/ =404;
    }
}
